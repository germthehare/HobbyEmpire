<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Hobby Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #B8942A; --gold2: #D4AD47; --gold3: #F0CC6A;
    --dark: #080808; --dark2: #111111; --dark3: #1A1A1A; --dark4: #242424;
    --text: #EAE6DF; --text2: #A89F94; --text3: #5C5650; --red: #C94040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--dark); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .card { background: var(--dark2); border: 1px solid #1a1a1a; border-radius: 20px; width: 100%; max-width: 380px; overflow: hidden; }

  .card-top { padding: 40px 32px 32px; text-align: center; border-bottom: 1px solid #111; }
  .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--gold3); margin-bottom: 4px; }
  .logo-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--text3); }

  .card-body { padding: 32px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .field input { width: 100%; background: var(--dark3); border: 1px solid #222; border-radius: 8px; padding: 13px 16px; color: var(--text); font-size: 15px; font-family: 'Barlow', sans-serif; outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: var(--gold); }
  .field input::placeholder { color: var(--text3); }

  .login-btn { width: 100%; background: var(--gold); border: none; border-radius: 8px; color: #000; font-size: 12px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase; padding: 15px; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
  .login-btn:hover { background: var(--gold3); }
  .login-btn:disabled { background: #222; color: #3a3a3a; cursor: not-allowed; }

  .error-box { background: rgba(201,64,64,0.08); border: 1px solid rgba(201,64,64,0.25); border-radius: 8px; padding: 12px 16px; color: #c97070; font-size: 13px; margin-top: 14px; display: none; text-align: center; }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <div class="logo">Hobby Empire</div>
    <div class="logo-sub">Connexion requise</div>
  </div>
  <div class="card-body">
    <div class="field">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="login-btn" onclick="login()">Se connecter</button>
    <div class="error-box" id="error-box">Identifiants incorrects. Réessayez.</div>
  </div>
</div>

<script>
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errorBox = document.getElementById('error-box');

  if (!username || !password) {
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion...';
  errorBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Erreur');
    }

    // Store session
    localStorage.setItem('he_token', data.token);
    localStorage.setItem('he_role', data.role);
    localStorage.setItem('he_user', data.username);

    // Redirect based on role
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) {
      window.location.href = redirect;
    } else if (data.role === 'admin') {
      window.location.href = '/';
    } else {
      window.location.href = '/break-prep.html';
    }
  } catch(e) {
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}
</script>
</body>
</html>
