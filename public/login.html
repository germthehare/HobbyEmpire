<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Hobby Empire</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Aliases : on garde les anciens noms pour ne rien casser. */
  .he-court {
    --gold:  var(--accent);
    --gold2: color-mix(in oklch, var(--accent), white 12%);
    --gold3: color-mix(in oklch, var(--accent), white 22%);
    --dark:  var(--bg);
    --dark2: var(--bg-3);
    --dark3: var(--bg-2);
    --dark4: var(--line);
    --text:  var(--ink);
    --text2: var(--ink-2);
    --text3: var(--ink-3);
    --red:   var(--neg);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--dark); color: var(--text); font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .card { background: var(--dark2); border: 1px solid var(--line); border-radius: var(--r-lg); width: 100%; max-width: 380px; overflow: hidden; box-shadow: var(--shadow-card); }

  .card-top { padding: 40px 32px 32px; text-align: center; border-bottom: 1px solid var(--line); }
  .logo-line { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .logo-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 2px; }
  .logo { font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: var(--ink); }
  .logo-sub { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text3); }

  .card-body { padding: 32px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .field input { width: 100%; background: var(--dark3); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 13px 16px; color: var(--text); font-size: 15px; font-family: var(--font-body); outline: none; transition: border-color 0.12s, box-shadow 0.12s; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 80%); }
  .field input::placeholder { color: var(--mute); }

  .login-btn { width: 100%; background: var(--accent); border: none; border-radius: var(--r-sm); color: var(--accent-ink); font-size: 11px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; padding: 15px; cursor: pointer; margin-top: 8px; transition: filter 0.12s, transform 0.12s; }
  .login-btn:hover { filter: brightness(1.05); }
  .login-btn:active { transform: translateY(1px); }
  .login-btn:disabled { background: var(--line); color: var(--mute); cursor: not-allowed; filter: none; }

  .error-box {
    background: color-mix(in oklch, var(--neg), transparent 88%);
    border: 1px solid color-mix(in oklch, var(--neg), transparent 65%);
    border-radius: var(--r-sm);
    padding: 12px 16px;
    color: var(--neg);
    font-size: 13px;
    margin-top: 14px;
    display: none;
    text-align: center;
  }
</style>
</head>
<body class="he-root he-court">

<div class="card">
  <div class="card-top">
    <div class="logo-line">
      <span class="logo-dot"></span>
      <span class="logo">Hobby Empire</span>
    </div>
    <div class="logo-sub">Connexion requise</div>
  </div>
  <div class="card-body">
    <div class="field">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="login-btn" onclick="login()">Se connecter</button>
    <div class="error-box" id="error-box">Identifiants incorrects. Réessayez.</div>
  </div>
</div>

<script>
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errorBox = document.getElementById('error-box');

  if (!username || !password) {
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion...';
  errorBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Erreur');
    }

    // Store session
    localStorage.setItem('he_token', data.token);
    localStorage.setItem('he_role', data.role);
    localStorage.setItem('he_user', data.username);

    // Redirect based on role
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) {
      window.location.href = redirect;
    } else if (data.role === 'admin') {
      window.location.href = '/';
    } else {
      window.location.href = '/break-prep.html';
    }
  } catch(e) {
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}
</script>
</body>
</html>
